name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 装依赖
        run: |
          pip install -r requirements.txt
          pip install pytest
      - name: 测试（不联网，cache/ 为空时用合成面板）
        run: python3 -m pytest tests/ -q
      - name: 导入冒烟
        run: python3 -c "import qdesk; print('qdesk ok', qdesk.__name__)"
